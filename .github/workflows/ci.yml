name: CI

on:
  pull_request:
  push:
    # A glob, not a literal: this filter named draft-18 back when that was the
    # default branch (e53c5e0), so when the default moved to draft-19 every push
    # to it went unbuilt until someone noticed. draft-* covers the current draft
    # branch and the next one without an edit.
    #
    # Two places still need the literal branch name, so a draft bump has to
    # touch both: the README's CI badge (GitHub badges take one branch and no
    # globs) and the publish-coverage job below, which must not deploy Pages
    # from anything but the default branch.
    branches: ['draft-*']
  # Lets the third-party interop job below be run on demand while it is ungated.
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. new push to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...

  race:
    name: Test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  # pkg/relay/discovery/etcd is a separate Go module, so `go test ./...` from the
  # root never sees it — it went unbuilt, untested, unlinted and unscanned here
  # for its whole existence, while relay-etcd is the binary the multi-instance
  # deployments run. It `replace`s github.com/floatdrop/moq-go => ../../../..,
  # so this job is also the guard that a change to the root module's API doesn't
  # break the discovery backend — precisely the breakage the root suite cannot
  # see. Its tests are hermetic (an embedded in-process etcd), so no services
  # are needed.
  #
  # Kept as a matrix over one module: a second backend has lived here before and
  # adding one back should be a one-word change.
  submodules:
    name: Submodule ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [etcd]
    defaults:
      run:
        working-directory: pkg/relay/discovery/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: pkg/relay/discovery/${{ matrix.module }}/go.mod
      - run: go build ./...
      - run: go test -race ./...
      - run: go vet ./...

  # Measures coverage and builds the report site. Deliberately NOT a gate on
  # coverage: there is no floor left to breach, so no drop can fail it. The
  # signal is the README badge and the published report, both read by hand. See
  # CLAUDE.md "Coverage is measured, not enforced" for the trade-off accepted
  # here.
  #
  # It can still go red, because coverage is measured by running the suite and
  # an unmeasurable suite is a failure worth surfacing. When it does, read it as
  # a duplicate of the Test job rather than as anything about coverage.
  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Spans BOTH modules — the root and pkg/relay/discovery/etcd, which has
      # its own go.mod and which `go test ./pkg/...` cannot reach. Measured with
      # -coverpkg, so a package is credited for every line the suite exercises
      # rather than only for what its own tests reach; most of wire is driven by
      # message/session/relay tests.
      # pipefail is load-bearing: the default shell is `bash -e`, which takes a
      # pipeline's status from its LAST command, so without it a failed suite
      # would exit through tee as a success and this step would pass green.
      - name: Measure
        run: |
          set -o pipefail
          make cover-site | tee coverage-summary.txt
      # Puts the per-package table on the run's summary page, so a regression is
      # visible in the run that caused it without anyone opening the report.
      - name: Job summary
        run: |
          {
            echo '### Coverage'
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Split from the job above so that one can run on every push and pull request
  # while publishing stays on the default branch: a Pages deployment is
  # repo-global, so deploying from a branch or a fork's PR would overwrite the
  # published report with an unmerged one.
  publish-coverage:
    name: Publish coverage report
    needs: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/draft-19'
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow's `contents: read` outright, so
    # it has to be restated alongside the two Pages needs.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  bench:
    name: Benchmarks (smoke)
    runs-on: ubuntu-latest
    # This job is the only thing that runs the sessiontest bufPipe (via
    # BenchmarkFanoutBuffered, which the -skip in `make bench` excludes but this
    # target deliberately keeps). That is mutex/cond code, so a deadlock here
    # would otherwise hang for GitHub's 6h default instead of failing fast.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Compile-and-run only, one iteration each (~7s). CI runners are far too
      # noisy for timing or allocation assertions, so this asserts nothing about
      # the numbers — it only keeps a benchmark from silently rotting into
      # something that no longer builds or panics. Regression comparison is the
      # local `make bench-quick` / `benchstat` step; see benchmarks/README.md.
      - run: make bench-smoke

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  modernize:
    name: Modernize (errorsastype)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # golangci-lint v2.12.2 bundles a modernize snapshot that predates the
      # errorsastype analyzer, so run that check standalone. See CLAUDE.md.
      - run: |
          go run golang.org/x/tools/gopls/internal/analysis/modernize/cmd/modernize@latest \
            -errorsastype ./...

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Interop is gated on independent implementations: the unit tests round-trip
  # through this codebase's own codec, so a wire-encoding regression (e.g. QUIC
  # varints instead of the §1.4.1 leading-ones encoding) passes every unit test
  # yet breaks interop. Both jobs use Docker (preinstalled on the runner). The
  # advisory `make interop-matrix` is intentionally not gated — it has known
  # cross-implementation divergences (see STATUS.md).
  # Manual-only: every published third-party client still speaks draft-18, while
  # this relay advertises only the "moqt-19" ALPN, so the TLS handshake cannot
  # complete and every case fails with "failed to connect to server". Gating on
  # it would mean a permanently red required check. Re-enable by deleting the
  # `if:` once the interop images move to draft-19 — nothing else about the job
  # needs to change. Run it meanwhile from the Actions tab (workflow_dispatch).
  interop:
    name: Interop (relay ← third-party client)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Our relay vs the moq-dev-rs draft-18 client over raw QUIC + WebTransport.
      - run: make interop

  interop-client:
    name: Interop (our client → our relay)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Loopback regression guard over BOTH transport mappings: our client and
      # relay agree on all six cases via moqt:// and via https://. This is the
      # only interop coverage left while the job above is manual, and the only
      # thing exercising the relay container's WebTransport path — a stale
      # -webtransport flag in entrypoint-relay.sh once broke exactly that.
      - run: make interop-loopback
