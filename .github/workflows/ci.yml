name: CI

on:
  pull_request:
  push:
    branches: [draft-18]

# Cancel superseded runs on the same ref (e.g. new push to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...

  # apps/tlmst is a deliberately separate module (CGO/WebKit/Wails deps kept out
  # of the root build), so the jobs above never touch it. This job guards it
  # against breakage — e.g. a stale module path in the regenerated frontend
  # bindings after a rename. It builds the SvelteKit frontend (the Go binary
  # embeds frontend/dist) and then compiles the desktop binary.
  tlmst:
    name: Build (apps/tlmst)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tlmst
    steps:
      - uses: actions/checkout@v7
      # Wails3 links against GTK4 + WebKitGTK 6.0 on Linux via CGO (its default;
      # pkg-config resolves gtk4 and webkitgtk-6.0).
      - name: Install GUI toolkits
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/tlmst/go.mod
          cache-dependency-path: apps/tlmst/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/tlmst/frontend/package-lock.json
      - name: Build frontend
        working-directory: apps/tlmst/frontend
        run: |
          npm ci
          npm run build
      # `go build ./...` fails in build/ios (iOS scaffolding, ios-tag only), so
      # build the root package, which covers the whole backend.
      - run: go build .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...

  race:
    name: Test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  modernize:
    name: Modernize (errorsastype)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # golangci-lint v2.12.2 bundles a modernize snapshot that predates the
      # errorsastype analyzer, so run that check standalone. See CLAUDE.md.
      - run: |
          go run golang.org/x/tools/gopls/internal/analysis/modernize/cmd/modernize@latest \
            -errorsastype ./...

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Interop is gated on independent implementations: the unit tests round-trip
  # through this codebase's own codec, so a wire-encoding regression (e.g. QUIC
  # varints instead of the §1.4.1 leading-ones encoding) passes every unit test
  # yet breaks interop. Both jobs use Docker (preinstalled on the runner). The
  # advisory `make interop-matrix` is intentionally not gated — it has known
  # cross-implementation divergences (see STATUS.md).
  interop:
    name: Interop (relay ← third-party client)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Our relay vs the moq-dev-rs draft-18 client over raw QUIC + WebTransport.
      - run: make interop

  interop-client:
    name: Interop (our client → our relay)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Loopback regression guard: our client and relay agree on all six cases.
      - run: make interop-client
